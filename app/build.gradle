plugins {
    id 'com.android.application'
}

// 排除重复的 annotations 库
configurations.all {
    resolutionStrategy {
        // 强制使用单一版本的 annotations
        force 'org.jetbrains:annotations:23.0.0'
    }
    // 排除旧版本的 annotations-java5
    exclude group: 'org.jetbrains', module: 'annotations-java5'
}

android {
    namespace 'com.schoolforum.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.schoolforum.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 服务器地址：默认指向公网测试实例（该实例已移除邮箱验证，便于联调）
        // 本地联调（模拟器 → WSL 内的本地服务）无需改文件，构建时覆盖即可：
        //   ./gradlew assembleDebug -PbaseUrl=http://10.0.2.2:2080
        // 或在项目根 gradle.properties 写一行：baseUrl=http://10.0.2.2:2080
        def apiBaseUrl = project.findProperty('baseUrl') ?: 'https://xek114514.ccwu.cc'
        buildConfigField "String", "BASE_URL", "\"${apiBaseUrl}\""

        // 是否为「测试版」构建（见下方 smoke buildType）。
        // 正式版为 false：注册/登录保留邮箱验证码 + 图形验证码的完整校验；
        // 测试版为 true：公网实例已移除邮箱验证与人机验证，客户端同步跳过。
        buildConfigField "boolean", "TEST_BUILD", "false"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 不再单独覆盖 BASE_URL：与 defaultConfig 保持一致（公网实例）。
            // 需要发布包指向别处时，用 -PbaseUrl=... 覆盖，或改 defaultConfig 里的默认值。
        }
        debug {
            // Debug 包沿用 defaultConfig 中的地址（默认公网实例）；
            // 需要连本地服务时用 -PbaseUrl=... 覆盖，无需重复声明
        }

        // 测试版（小规模测试专用）：与正式版同签名、可并存安装。
        //   ./gradlew assembleSmoke      → app/build/outputs/apk/smoke/app-smoke.apk
        // 与 debug 的差异：
        //   1. applicationId 加 .test 后缀 → 独立应用，可与正式版同时安装
        //   2. 应用名显示「校园论坛（测试）」、启动图标带 TEST 角标（见 src/smoke/res/）
        //   3. BuildConfig.TEST_BUILD=true → 登录/注册跳过邮箱验证码与人机验证
        smoke {
            initWith debug
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "TEST_BUILD", "true"
            matchingFallbacks = ['debug', 'release']
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // 确保使用Java 17工具链
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // JSON解析
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // 圆形头像
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    
    // Markdown渲染
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:image-glide:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation('io.noties.markwon:ext-latex:4.6.2') {
        // 排除传递依赖 ru.noties:jlatexmath-android:0.2.0（jitpack 已 404 无法解析，
        // 且与下方 1.3 同包名会造成 DEX 重复类冲突）
        exclude group: 'ru.noties', module: 'jlatexmath-android'
    }
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    // Prism4j 原生代码高亮（语言定义见 io/noties/prism4j/languages，注册见 ForumPrismBundle）
    implementation 'io.noties:prism4j:2.0.0'
    annotationProcessor 'io.noties:prism4j-bundler:2.0.0'
    // LaTeX 渲染引擎升级：ext-latex 原传递依赖 jlatexmath 0.2.0（2019年，宏支持有限，
    // 且 jitpack 已 404），改用 noties 的活跃 fork rikkahub 发布的 1.3
    // （2026-01，聚合 POM 自动带 jlatexmath 核心 + 西里尔/希腊字体；
    //  包名仍为 ru.noties.jlatexmath，与 ext-latex 完全兼容）
    implementation 'com.github.rikkahub:jlatexmath-android:1.3'
    
    // 图片缩放查看
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    
    // EXIF信息读取（用于图片旋转）
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // SVG 渲染（图形验证码）
    implementation 'com.caverock:androidsvg:1.4'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
